<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Press Operator Trainer</title>
<style>
  html, body { margin: 0; height: 100%; background: #151c23; overflow: hidden; font-family: system-ui, sans-serif; }
  canvas { display: block; }
  #hint {
    position: fixed; left: 12px; top: 12px; max-width: 340px; padding: 8px 10px; border-radius: 6px;
    background: rgba(14, 21, 27, 0.8); color: #cfe3f2; font-size: 13px; line-height: 1.4; pointer-events: none;
  }
  #hint b { color: #fff; }
</style>
<script type="importmap">
{ "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="hint"><b>Press Operator Trainer.</b> Click or tap the glowing part to follow the steps. On a Quest, press <b>Enter VR</b> and use the trigger.</div>
<script type="module">
import * as THREE from 'three';
import { VRButton } from 'three/addons/webxr/VRButton.js';

/* =====================================================================
   Training state and procedure
   ===================================================================== */
const st = {};
const STEPS = [
  { t: 'Inspect the oil level gauge',        done: () => st.oil },
  { t: 'Turn MAIN POWER on',                 done: () => st.power },
  { t: 'Release the E-STOP',                 done: () => st.power && !st.estop },
  { t: 'Set pressure to 120 bar',            done: () => st.power && st.pressure === 120 },
  { t: 'Raise guard, place part on die',     done: () => st.partLoc === 'die' },
  { t: 'Close the guard',                    done: () => !st.guardOpen && st.partLoc === 'die' },
  { t: 'Press both START buttons together',  done: () => st.stamped },
  { t: 'Raise guard, remove the part',       done: () => st.partLoc === 'bin' },
  { t: 'Close guard, turn MAIN POWER off',   done: () => !st.guardOpen && !st.power },
];
let hints = true;

function resetState() {
  Object.assign(st, {
    step: 0, power: false, estop: true, estopEmergency: false, guardOpen: false, pressure: 60,
    oil: false, partLoc: 'cart', stamped: false, cycle: null, aTime: -1e9, bTime: -1e9,
    violations: 0, wrongOrder: 0, startedAt: null, finishedAt: null,
    msg: { text: 'Welcome. Follow the steps on the left. Start by inspecting the oil level gauge on the front of the press.', kind: 'info' },
  });
}
resetState();

/* =====================================================================
   Renderer, scene, camera
   ===================================================================== */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x151c23);
scene.fog = new THREE.Fog(0x151c23, 7, 15);

const camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.05, 50);
function frameCamera() {
  const portrait = innerWidth / innerHeight < 0.9;
  camera.position.set(0, 1.55, portrait ? 2.7 : 0.8);
  camera.lookAt(0, 1.3, -1.4);
}
frameCamera();

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.xr.enabled = true;
document.body.appendChild(renderer.domElement);
document.body.appendChild(VRButton.createButton(renderer));

scene.add(new THREE.HemisphereLight(0xcfe8ff, 0x2a3036, 1.0));
const sun = new THREE.DirectionalLight(0xffffff, 1.4);
sun.position.set(2, 4, 2);
scene.add(sun);

/* =====================================================================
   Helpers
   ===================================================================== */
const interactables = [];
function mat(color, opts) { return new THREE.MeshStandardMaterial(Object.assign({ color, roughness: 0.6, metalness: 0.25 }, opts || {})); }
function box(w, h, d, color, x, y, z, parent) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat(color));
  m.position.set(x, y, z); (parent || scene).add(m); return m;
}
function cylZ(r, h, color, x, y, z, parent) {
  const g = new THREE.CylinderGeometry(r, r, h, 24); g.rotateX(Math.PI / 2);
  const m = new THREE.Mesh(g, mat(color)); m.position.set(x, y, z); (parent || scene).add(m); return m;
}
function sphere(r, color, x, y, z, parent) {
  const m = new THREE.Mesh(new THREE.SphereGeometry(r, 16, 12), mat(color, { emissive: 0x000000 }));
  m.position.set(x, y, z); (parent || scene).add(m); return m;
}
function canvasTex(c) { const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t; }
function labelTex(text, w, h, o) {
  o = o || {};
  const c = document.createElement('canvas'); c.width = 512; c.height = Math.max(32, Math.round(512 * h / w));
  const g = c.getContext('2d');
  if (o.bg) { g.fillStyle = o.bg; g.fillRect(0, 0, c.width, c.height); }
  let px = Math.round(c.height * 0.62);
  g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillStyle = o.fg || '#e8eef2';
  do { g.font = '700 ' + px + 'px system-ui, sans-serif'; px -= 2; } while (g.measureText(text).width > c.width * 0.94 && px > 10);
  g.fillText(text, c.width / 2, c.height / 2 + 2);
  return canvasTex(c);
}
function label(text, w, h, x, y, z, parent, o) {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ map: labelTex(text, w, h, o), transparent: true }));
  m.position.set(x, y, z); (parent || scene).add(m); return m;
}
function interactive(mesh, handler) { mesh.userData.click = handler; interactables.push(mesh); return mesh; }
const ease = (k) => (k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2);
const fmtTime = () => {
  if (!st.startedAt) return '0:00';
  const s = Math.floor(((st.finishedAt || performance.now()) - st.startedAt) / 1000);
  return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
};

/* =====================================================================
   Workshop: floor, safety zone, wall sign
   ===================================================================== */
const floor = new THREE.Mesh(new THREE.PlaneGeometry(16, 16), mat(0x3a4047, { roughness: 0.9, metalness: 0 }));
floor.rotation.x = -Math.PI / 2; scene.add(floor);
const YEL = 0xf2c230;
box(2.8, 0.01, 0.07, YEL, 0, 0.005, -0.45, scene);
box(2.8, 0.01, 0.07, YEL, 0, 0.005, -2.05, scene);
box(0.07, 0.01, 1.67, YEL, -1.4, 0.005, -1.25, scene);
box(0.07, 0.01, 1.67, YEL, 1.4, 0.005, -1.25, scene);
box(8, 3.2, 0.1, 0x222a31, 0, 1.6, -3.4, scene);
label('AUTHORISED OPERATORS ONLY', 1.6, 0.18, 0, 2.2, -3.34, scene, { fg: '#f2c230' });

/* =====================================================================
   Press
   ===================================================================== */
const RAM_HOME = 1.55, RAM_PRESS = 1.26;
box(1.2, 0.94, 0.8, 0x44627a, 0, 0.47, -1.5);                 // base
box(0.7, 0.06, 0.5, 0x2c3338, 0, 0.97, -1.5);                 // die plate (top at y = 1.0)
box(0.12, 1.1, 0.12, 0x44627a, -0.5, 1.5, -1.8);              // columns
box(0.12, 1.1, 0.12, 0x44627a, 0.5, 1.5, -1.8);
box(1.1, 1.1, 0.05, 0x3a5368, 0, 1.5, -1.88);                 // rear frame
box(1.2, 0.3, 0.8, 0x35505f, 0, 2.2, -1.5);                   // head
label('HYDRAULIC PRESS 01', 0.6, 0.09, 0.22, 0.75, -1.099, scene, { fg: '#ffffff' });

const ram = box(0.5, 0.3, 0.4, 0x9aa5ae, 0, RAM_HOME, -1.5);
box(0.3, 0.08, 0.25, 0x2c3338, 0, -0.19, 0, ram);              // punch
const rod = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 1, 16), mat(0xc6ced4));
rod.position.z = -1.5; scene.add(rod);
function setRam(y) {
  ram.position.y = y;
  const top = y + 0.15, len = 2.05 - top;
  rod.scale.y = len; rod.position.y = top + len / 2;
}
setRam(RAM_HOME);

// oil sight gauge (front of base)
cylZ(0.07, 0.03, 0x1b1f23, -0.35, 0.62, -1.095);
const oilGlass = interactive(cylZ(0.055, 0.01, 0x2a7a4a, -0.35, 0.62, -1.08), () => onOil());
label('OIL LEVEL', 0.2, 0.05, -0.35, 0.73, -1.099, scene, { fg: '#ffffff' });

// guard (light curtain style door, slides up)
const GUARD_CLOSED_Y = 1.3, GUARD_OPEN_Y = 1.95;
const guard = new THREE.Group(); guard.position.set(0, GUARD_CLOSED_Y, -1.05); scene.add(guard);
const guardGlass = new THREE.Mesh(
  new THREE.BoxGeometry(0.9, 0.55, 0.015),
  mat(0x9ad1ff, { transparent: true, opacity: 0.3, roughness: 0.1, metalness: 0 })
);
guard.add(guardGlass);
box(0.98, 0.04, 0.04, YEL, 0, 0.295, 0, guard);
box(0.98, 0.04, 0.04, YEL, 0, -0.295, 0, guard);
box(0.04, 0.6, 0.04, YEL, -0.47, 0, 0, guard);
box(0.04, 0.6, 0.04, YEL, 0.47, 0, 0, guard);
interactive(guardGlass, () => onGuard());
const lampGuard = sphere(0.035, 0x113322, 0.48, 2.2, -1.09);
label('GUARD', 0.12, 0.03, 0.48, 2.12, -1.099, scene, { fg: '#cfe3f2' });

// carts and part
box(0.4, 0.88, 0.5, 0x59636d, -0.95, 0.44, -1.35);
label('RAW PARTS', 0.3, 0.06, -0.95, 0.6, -1.099, scene, { fg: '#ffffff' });
box(0.4, 0.6, 0.45, 0x6a5a3a, -0.95, 0.3, -0.65);
label('FINISHED', 0.3, 0.06, -0.95, 0.4, -0.424, scene, { fg: '#ffffff' });
const PART_CART = new THREE.Vector3(-0.95, 0.8925, -1.35);
const PART_DIE = new THREE.Vector3(0, 1.0125, -1.5);
const PART_BIN = new THREE.Vector3(-0.95, 0.6125, -0.65);
const part = new THREE.Mesh(new THREE.BoxGeometry(0.26, 0.025, 0.2), mat(0xb9c2c9, { metalness: 0.7, roughness: 0.35 }));
part.position.copy(PART_CART); scene.add(part);
const boss = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.02, 0.1), mat(0x6f8aa6, { metalness: 0.7, roughness: 0.3 }));
boss.position.y = 0.02; boss.visible = false; part.add(boss);
interactive(part, () => onPart());

/* =====================================================================
   Operator control panel (right side, tilted toward the trainee)
   ===================================================================== */
box(0.34, 0.78, 0.3, 0x2b333b, 0.97, 0.39, -0.95);
const panel = new THREE.Group();
panel.position.set(0.95, 1.05, -0.85);
panel.rotation.order = 'YXZ';
panel.rotation.set(-0.35, -0.58, 0);
scene.add(panel);
box(0.52, 0.64, 0.06, 0x2b333b, 0, 0, 0, panel);

const lampPower = sphere(0.014, 0x113322, -0.14, 0.275, 0.035, panel);
const lampStop = sphere(0.014, 0x331111, 0.13, 0.285, 0.035, panel);

cylZ(0.06, 0.01, 0x14181c, -0.14, 0.2, 0.035, panel);
const powerKnob = cylZ(0.045, 0.04, 0xd8dde1, -0.14, 0.2, 0.055, panel);
box(0.012, 0.035, 0.005, 0x111111, 0, 0.025, 0.0225, powerKnob);
powerKnob.rotation.z = 0.8;
interactive(powerKnob, () => onPower());
label('MAIN POWER', 0.17, 0.04, -0.14, 0.125, 0.031, panel);

cylZ(0.072, 0.015, YEL, 0.13, 0.2, 0.0375, panel);
const estopCap = interactive(cylZ(0.052, 0.05, 0xd22b22, 0.13, 0.2, 0.06, panel), () => onEstop());
label('E-STOP', 0.14, 0.04, 0.13, 0.115, 0.031, panel);

label('PRESSURE (BAR)', 0.24, 0.032, 0, 0.088, 0.031, panel);
const gaugeC = document.createElement('canvas'); gaugeC.width = 256; gaugeC.height = 140;
const gaugeX = gaugeC.getContext('2d');
const gaugeTex = canvasTex(gaugeC);
const gauge = new THREE.Mesh(new THREE.PlaneGeometry(0.2, 0.11), new THREE.MeshBasicMaterial({ map: gaugeTex }));
gauge.position.set(0, 0.01, 0.031); panel.add(gauge);
const minusBtn = interactive(box(0.07, 0.07, 0.03, 0x555d65, -0.17, 0.01, 0.045, panel), () => onAdjust(-10));
const plusBtn = interactive(box(0.07, 0.07, 0.03, 0x555d65, 0.17, 0.01, 0.045, panel), () => onAdjust(10));
label('-', 0.06, 0.06, -0.17, 0.01, 0.0605, panel, { fg: '#ffffff' });
label('+', 0.06, 0.06, 0.17, 0.01, 0.0605, panel, { fg: '#ffffff' });

const startA = interactive(cylZ(0.04, 0.035, 0x1f9d55, -0.12, -0.14, 0.0475, panel), () => onStart('A'));
const startB = interactive(cylZ(0.04, 0.035, 0x1f9d55, 0.12, -0.14, 0.0475, panel), () => onStart('B'));
label('START A', 0.13, 0.035, -0.12, -0.2, 0.031, panel);
label('START B', 0.13, 0.035, 0.12, -0.2, 0.031, panel);

const restartBtn = interactive(box(0.15, 0.045, 0.02, 0x555d65, -0.1, -0.27, 0.04, panel), () => onRestart());
label('RESTART', 0.14, 0.035, -0.1, -0.27, 0.0505, panel);
const hintsBtn = interactive(box(0.15, 0.045, 0.02, 0x2e7d4f, 0.1, -0.27, 0.04, panel), () => onHints());
label('HINTS', 0.14, 0.035, 0.1, -0.27, 0.0505, panel);

/* =====================================================================
   Training board (left side)
   ===================================================================== */
const boardC = document.createElement('canvas'); boardC.width = 1024; boardC.height = 768;
const bg = boardC.getContext('2d');
const boardTex = canvasTex(boardC);
const board = new THREE.Mesh(new THREE.PlaneGeometry(1.1, 0.825), new THREE.MeshBasicMaterial({ map: boardTex }));
board.position.set(-1.0, 1.6, -0.9); board.rotation.y = 0.53; scene.add(board);

const KIND = { info: '#cfe3f2', ok: '#6fdc9a', warn: '#ffcf66', bad: '#ff7b6b' };
function wrapText(g, text, x, y, maxW, lh) {
  const words = text.split(' '); let line = '';
  for (const w of words) {
    const t = line ? line + ' ' + w : w;
    if (g.measureText(t).width > maxW && line) { g.fillText(line, x, y); y += lh; line = w; } else line = t;
  }
  g.fillText(line, x, y); return y;
}
let lastBoard = 0;
function drawBoard() {
  const g = bg, W = 1024, H = 768;
  lastBoard = performance.now();
  g.fillStyle = '#0e151b'; g.fillRect(0, 0, W, H);
  g.fillStyle = '#17222c'; g.fillRect(0, 0, W, 84);
  g.fillStyle = '#f2c230'; g.fillRect(0, 84, W, 4);
  g.textBaseline = 'middle'; g.textAlign = 'left'; g.fillStyle = '#ffffff';
  g.font = '700 30px system-ui, sans-serif'; g.fillText('PRESS-01  STARTUP & RUN', 28, 44);
  g.textAlign = 'right'; g.font = '500 24px ui-monospace, monospace';
  g.fillStyle = st.violations ? '#ff7b6b' : '#9fb3c2';
  g.fillText('Violations ' + st.violations + '   ' + fmtTime(), W - 28, 44);
  g.textAlign = 'left';
  STEPS.forEach((s, i) => {
    const y = 104 + i * 52, cur = i === st.step, done = i < st.step, cx = 48, cy = y + 23;
    if (cur) { g.fillStyle = '#1b3446'; g.fillRect(16, y, W - 32, 46); }
    if (done) {
      g.fillStyle = '#2f9e63'; g.beginPath(); g.arc(cx, cy, 15, 0, Math.PI * 2); g.fill();
      g.strokeStyle = '#ffffff'; g.lineWidth = 3.5; g.beginPath(); g.moveTo(cx - 7, cy); g.lineTo(cx - 2, cy + 6); g.lineTo(cx + 8, cy - 6); g.stroke();
    } else if (cur) {
      g.fillStyle = '#f2c230'; g.beginPath(); g.moveTo(cx - 8, cy - 12); g.lineTo(cx + 12, cy); g.lineTo(cx - 8, cy + 12); g.closePath(); g.fill();
    } else {
      g.strokeStyle = '#3b4a57'; g.lineWidth = 3; g.beginPath(); g.arc(cx, cy, 14, 0, Math.PI * 2); g.stroke();
    }
    g.fillStyle = done ? '#7f95a5' : cur ? '#ffffff' : '#8aa0b0';
    g.font = (cur ? '600 ' : '400 ') + '27px system-ui, sans-serif';
    g.fillText((i + 1) + '.  ' + s.t, 84, cy + 1);
  });
  const finished = st.step >= STEPS.length;
  const kind = finished ? (st.violations ? 'warn' : 'ok') : st.msg.kind;
  const text = finished
    ? 'COMPLETE. Time ' + fmtTime() + ', safety violations ' + st.violations + ', out-of-order actions ' + st.wrongOrder + '. ' +
      (st.violations ? 'Review the guard and pressure rules, then try again.' : 'No violations. Well done.') + ' Press RESTART on the panel to go again.'
    : st.msg.text;
  g.fillStyle = '#121c24'; g.fillRect(16, 584, W - 32, 168);
  g.fillStyle = KIND[kind]; g.fillRect(16, 584, 8, 168);
  g.font = '500 28px system-ui, sans-serif'; g.textBaseline = 'alphabetic';
  wrapText(g, text, 44, 624, W - 100, 36);
  boardTex.needsUpdate = true;
}
function drawGauge() {
  const g = gaugeX;
  g.fillStyle = '#05080a'; g.fillRect(0, 0, 256, 140);
  g.textAlign = 'center'; g.textBaseline = 'middle';
  if (st.power) {
    g.fillStyle = '#ffb000'; g.font = '700 78px ui-monospace, monospace'; g.fillText(String(st.pressure), 118, 62);
    g.font = '600 22px system-ui, sans-serif'; g.fillText('BAR', 226, 100);
    g.fillStyle = '#3a2a00'; g.fillRect(16, 112, 224, 10);
    g.fillStyle = st.pressure > 160 ? '#ff4b3a' : '#ffb000'; g.fillRect(16, 112, 224 * (st.pressure - 40) / 160, 10);
  } else {
    g.fillStyle = '#3a2a00'; g.font = '700 70px ui-monospace, monospace'; g.fillText('OFF', 128, 70);
  }
  gaugeTex.needsUpdate = true;
}
function refresh() {
  drawBoard(); drawGauge();
  hintsBtn.material.color.setHex(hints ? 0x2e7d4f : 0x555d65);
}
function say(text, kind) { st.msg = { text, kind: kind || 'info' }; drawBoard(); }

/* =====================================================================
   Audio and haptics
   ===================================================================== */
let actx = null;
function ensureAudio() {
  try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === 'suspended') actx.resume(); } catch (e) { /* no audio */ }
}
function tone(f, d, type, v) {
  try {
    if (!actx) return;
    const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime;
    o.type = type || 'sine'; o.frequency.value = f;
    g.gain.setValueAtTime(v || 0.07, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t + d);
  } catch (e) { /* ignore */ }
}
const sndOk = () => tone(660, 0.09), sndBad = () => tone(150, 0.3, 'square', 0.06), sndTap = () => tone(420, 0.04);
function haptic(c) {
  try {
    const a = c && c.userData.src && c.userData.src.gamepad && c.userData.src.gamepad.hapticActuators && c.userData.src.gamepad.hapticActuators[0];
    if (a && a.pulse) a.pulse(0.5, 40);
  } catch (e) { /* ignore */ }
}

/* =====================================================================
   Procedure logic
   ===================================================================== */
function advance() {
  let moved = false;
  while (st.step < STEPS.length && STEPS[st.step].done()) { st.step++; moved = true; }
  if (moved) {
    if (st.step >= STEPS.length) { st.finishedAt = performance.now(); sndOk(); }
    else { say('Step done. Next: ' + STEPS[st.step].t + '.', 'ok'); sndOk(); }
  }
  refresh();
}
function allowed(steps) {
  if (st.step >= STEPS.length) { say('Training is complete. Press RESTART on the panel to go again.', 'info'); return false; }
  if (steps.indexOf(st.step) >= 0) { if (!st.startedAt) st.startedAt = performance.now(); return true; }
  st.wrongOrder++; sndBad();
  say('Not yet. Next: ' + STEPS[st.step].t + '.', 'warn'); refresh();
  return false;
}
function violation(text) {
  if (!st.startedAt) st.startedAt = performance.now();
  st.violations++; sndBad();
  say('SAFETY VIOLATION: ' + text, 'bad'); refresh();
}

function onOil() {
  if (!allowed([0])) return;
  st.oil = true; say('Oil level is in the green band. Good.', 'ok'); advance();
}
function onPower() {
  if (!allowed([1, 8])) return;
  st.power = !st.power;
  say(st.power ? 'Main power on. The control lamp is lit. The E-STOP is still engaged.' : 'Main power off. The machine is isolated.', st.power ? 'ok' : 'info');
  advance();
}
function onEstop() {
  if (st.cycle && !st.estop) {
    st.estop = true; st.estopEmergency = true;
    st.cycle = { phase: 'abort', t: 0, from: ram.position.y };
    sndBad(); say('Emergency stop. The ram is returning and held. Release the E-STOP when it is safe, then restart the cycle.', 'warn'); refresh(); return;
  }
  if (st.estop) {
    if (st.cycle) { say('Wait for the ram to stop moving.', 'warn'); return; }
    if (!st.estopEmergency && !allowed([2])) return;
    if (!st.power) { say('Turn MAIN POWER on first.', 'warn'); return; }
    st.estop = false; st.estopEmergency = false;
    say('E-STOP released.', 'ok'); advance(); return;
  }
  say('Leave the E-STOP released. Use it only in an emergency.', 'info');
}
function onAdjust(d) {
  if (!allowed([3])) return;
  st.pressure = Math.max(40, Math.min(200, st.pressure + d));
  if (st.pressure > 160) { violation('Pressure above the 160 bar die rating. Lower it.'); advance(); return; }
  say('Pressure ' + st.pressure + ' bar. Target is 120.', 'info'); advance();
}
function onGuard() {
  if (st.cycle) { violation('Never reach for the guard during a cycle. It is interlocked for your safety.'); return; }
  if (!allowed([4, 5, 6, 7, 8])) return;
  st.guardOpen = !st.guardOpen;
  say(st.guardOpen ? 'Guard raised. The interlock lamp is red, so the press cannot cycle.' : 'Guard closed. The interlock lamp is green.', 'info');
  advance();
}
function onPart() {
  if (st.partLoc === 'cart') {
    if (!allowed([4])) return;
    if (!st.guardOpen) { say('Raise the guard first.', 'warn'); return; }
    st.partLoc = 'die'; moveObj(part, PART_DIE, 0.7);
    say('Part placed on the die. Keep your hands clear when you close the guard.', 'ok'); advance(); return;
  }
  if (st.partLoc === 'die' && st.stamped) {
    if (!allowed([7])) return;
    if (!st.guardOpen) { say('Raise the guard first.', 'warn'); return; }
    st.partLoc = 'bin'; moveObj(part, PART_BIN, 0.7);
    say('Finished part is in the bin.', 'ok'); advance(); return;
  }
  say('Nothing to do with the part right now.', 'info');
}
function onStart(which) {
  const now = performance.now();
  const other = which === 'A' ? st.bTime : st.aTime;
  if (which === 'A') st.aTime = now; else st.bTime = now;
  if (!st.power) { say('No power. Turn MAIN POWER on first.', 'warn'); return; }
  if (st.estop) { say('The E-STOP is engaged. Release it first.', 'warn'); return; }
  if (st.guardOpen) { st.aTime = st.bTime = -1e9; violation('START pressed with the guard open. Never bypass the interlock.'); return; }
  if (st.cycle) return;
  if (now - other <= 1000) {
    st.aTime = st.bTime = -1e9;
    if (!allowed([6])) return;
    st.cycle = { phase: 'down', t: 0 };
    say('Cycle running. Keep clear.', 'info');
  } else {
    say('Press the other START button within 1 second. Two-hand control keeps your hands out of the die.', 'info');
  }
}
function onRestart() {
  resetState(); tweens.length = 0;
  part.position.copy(PART_CART); part.material.color.setHex(0xb9c2c9); boss.visible = false;
  setRam(RAM_HOME); sndTap(); refresh();
}
function onHints() { hints = !hints; sndTap(); say(hints ? 'Hints on. The next control glows.' : 'Hints off.', 'info'); refresh(); }

/* =====================================================================
   Tweens and per-frame animation
   ===================================================================== */
const tweens = [];
function moveObj(obj, to, dur) {
  for (let i = tweens.length - 1; i >= 0; i--) if (tweens[i].obj === obj) tweens.splice(i, 1);
  tweens.push({ obj, from: obj.position.clone(), to: to.clone(), t: 0, dur });
}
function hintTargets() {
  if (st.estop && st.estopEmergency && !st.cycle) return [estopCap];
  if (st.cycle) return [];
  switch (st.step) {
    case 0: return [oilGlass];
    case 1: return [powerKnob];
    case 2: return [estopCap];
    case 3: return [st.pressure < 120 ? plusBtn : minusBtn];
    case 4: return [st.guardOpen ? part : guardGlass];
    case 5: return [guardGlass];
    case 6: return [startA, startB];
    case 7: return [st.guardOpen ? part : guardGlass];
    case 8: return [st.guardOpen ? guardGlass : powerKnob];
    default: return [];
  }
}
const HOVER = new THREE.Color(0x2f7fa8), HINT = new THREE.Color(0xb07a00);
const hot = new Set();
function applyEmissive(time) {
  const targets = hints ? hintTargets() : [];
  const pulse = (0.35 + 0.35 * Math.sin(time * 4)) * 1.6;
  for (const m of interactables) {
    const c = m.material.emissive;
    if (hot.has(m)) c.copy(HOVER);
    else if (targets.indexOf(m) >= 0) c.copy(HINT).multiplyScalar(pulse);
    else c.setRGB(0, 0, 0);
  }
}
function tickCycle(dt) {
  const c = st.cycle; if (!c) return;
  c.t += dt;
  if (c.phase === 'down') {
    const k = Math.min(1, c.t / 1.1); setRam(RAM_HOME + (RAM_PRESS - RAM_HOME) * ease(k));
    if (k >= 1) { c.phase = 'dwell'; c.t = 0; tone(110, 0.3, 'sawtooth', 0.09); }
  } else if (c.phase === 'dwell') {
    if (c.t >= 0.6) { c.phase = 'up'; c.t = 0; }
  } else if (c.phase === 'up') {
    const k = Math.min(1, c.t / 0.9); setRam(RAM_PRESS + (RAM_HOME - RAM_PRESS) * ease(k));
    if (k >= 1) {
      st.cycle = null; st.stamped = true; boss.visible = true; part.material.color.setHex(0x7d8f9f);
      say('Cycle complete. Raise the guard and remove the finished part.', 'ok'); advance();
    }
  } else {
    const k = Math.min(1, c.t / 0.6); setRam(c.from + (RAM_HOME - c.from) * ease(k));
    if (k >= 1) st.cycle = null;
  }
}
const damp = (cur, target, dt, rate) => cur + (target - cur) * Math.min(1, dt * rate);
function tickVisuals(dt) {
  guard.position.y = damp(guard.position.y, st.guardOpen ? GUARD_OPEN_Y : GUARD_CLOSED_Y, dt, 7);
  powerKnob.rotation.z = damp(powerKnob.rotation.z, st.power ? -0.8 : 0.8, dt, 10);
  estopCap.position.z = damp(estopCap.position.z, st.estop ? 0.06 : 0.035, dt, 14);
  lampPower.material.emissive.setHex(st.power ? 0x22ff66 : 0x000000);
  lampStop.material.emissive.setHex(st.estop && st.power ? 0xff3322 : 0x000000);
  lampGuard.material.emissive.setHex(st.guardOpen ? 0xff3322 : 0x22ff66);
  const now = performance.now();
  startA.position.z = damp(startA.position.z, now - st.aTime < 250 ? 0.04 : 0.0475, dt, 20);
  startB.position.z = damp(startB.position.z, now - st.bTime < 250 ? 0.04 : 0.0475, dt, 20);
  for (let i = tweens.length - 1; i >= 0; i--) {
    const tw = tweens[i]; tw.t += dt;
    const k = Math.min(1, tw.t / tw.dur);
    tw.obj.position.lerpVectors(tw.from, tw.to, ease(k));
    tw.obj.position.y += Math.sin(Math.PI * k) * 0.12;
    if (k >= 1) tweens.splice(i, 1);
  }
  if (st.startedAt && !st.finishedAt && now - lastBoard > 1000) drawBoard();
}

/* =====================================================================
   Input: VR controllers and mouse / touch
   ===================================================================== */
const raycaster = new THREE.Raycaster();
const tmpM = new THREE.Matrix4();
function pickFromController(c) {
  tmpM.identity().extractRotation(c.matrixWorld);
  raycaster.ray.origin.setFromMatrixPosition(c.matrixWorld);
  raycaster.ray.direction.set(0, 0, -1).applyMatrix4(tmpM);
  return raycaster.intersectObjects(interactables, false)[0] || null;
}
const pointer = new THREE.Vector2(); let pointerSeen = false;
function pickFromPointer() {
  raycaster.setFromCamera(pointer, camera);
  return raycaster.intersectObjects(interactables, false)[0] || null;
}
function activate(hit) { ensureAudio(); sndTap(); hit.object.userData.click(); }

const controllers = [0, 1].map((i) => {
  const c = renderer.xr.getController(i);
  const line = new THREE.Line(
    new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0, 0, 0), new THREE.Vector3(0, 0, -3)]),
    new THREE.LineBasicMaterial({ color: 0x9ad1ff })
  );
  c.add(line); c.userData.line = line;
  c.addEventListener('connected', (e) => { c.userData.src = e.data; });
  c.addEventListener('selectstart', () => { const hit = pickFromController(c); if (hit) { haptic(c); activate(hit); } });
  scene.add(c);
  return c;
});

renderer.domElement.addEventListener('pointermove', (e) => {
  const r = renderer.domElement.getBoundingClientRect();
  pointer.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  pointerSeen = true;
});
renderer.domElement.addEventListener('click', (e) => {
  const r = renderer.domElement.getBoundingClientRect();
  pointer.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  const hit = pickFromPointer(); if (hit) activate(hit);
});
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  if (!renderer.xr.isPresenting) frameCamera();
});

/* =====================================================================
   Main loop
   ===================================================================== */
const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05), time = clock.elapsedTime;
  tickCycle(dt); tickVisuals(dt);
  hot.clear();
  if (renderer.xr.isPresenting) {
    controllers.forEach((c) => {
      const hit = pickFromController(c);
      if (hit) hot.add(hit.object);
      c.userData.line.scale.z = hit ? hit.distance / 3 : 1;
    });
  } else if (pointerSeen) {
    const hit = pickFromPointer(); if (hit) hot.add(hit.object);
    renderer.domElement.style.cursor = hit ? 'pointer' : 'default';
  }
  applyEmissive(time);
  renderer.render(scene, camera);
});

refresh();
</script>
</body>
